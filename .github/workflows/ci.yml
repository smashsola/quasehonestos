name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch for lock refresh
        uses: actions/checkout@v4
        with:
          ref: fix-security-cloudflare
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh safe Wrangler lock
        run: npm install --package-lock-only --save-exact --save-dev wrangler@4.149.0
      - name: Persist dependency update
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Upgrade Wrangler to 4.149.0 and refresh lockfile"
            git push origin HEAD:fix-security-cloudflare
          fi
      - name: Install
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
