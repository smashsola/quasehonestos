name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh Wrangler lock for diagnosis
        run: |
          npm install --package-lock-only --save-dev wrangler@4.149.0
          git diff -- package.json package-lock.json
      - name: Install
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
