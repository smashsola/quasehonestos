<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><style>.speech-head{transform-origin:48px 72px;animation:nod 0.49019999999999997s ease-in-out infinite}.mouth-rest{animation:closed 0.0817s steps(1,end) infinite}.mouth-speaking{transform-origin:48px 62px;animation:syllable 0.0817s ease-out infinite}@keyframes closed{0%,80%,100%{opacity:1}10%,65%{opacity:0}}@keyframes syllable{0%,80%,100%{opacity:0;transform:scaleY(.15)}10%,65%{opacity:1;transform:scaleY(.95)}35%{opacity:1;transform:scaleY(.6)}}@keyframes nod{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-.7px)}}@media(prefers-reduced-motion:reduce){.speech-head{animation:gentle-nod 1.8s ease-in-out infinite}@keyframes gentle-nod{0%,100%{transform:translateY(0)}50%{transform:translateY(-.2px)}}}</style><rect width="96" height="96" rx="16" fill="#aca8ee"/><circle cx="75" cy="18" r="28" fill="#ffffff25"/><path d="M12 96Q14 70 38 70h20Q82 72 84 96" fill="#526897"/><g class="speech-head"><path d="M40 60h16v16Q48 83 40 76" fill="#f1c7ab"/><ellipse cx="48" cy="44" rx="23" ry="27" fill="#f1c7ab"/><g fill="#883c33"><path d="M20 44Q18 11 50 14Q76 17 76 44L64 33 52 26 30 37Z"/></g><path d="M32 36q5-3 10 0m12 0q5-3 10 0" stroke="#883c33" stroke-width="2" stroke-linecap="round"/><path d="M33 46q4-6 8 0m14 0q4-6 8 0" fill="none" stroke="#29303b" stroke-width="2.5" stroke-linecap="round"/><path d="M47 46l-2 9h5" fill="none" stroke="#915f4933" stroke-width="2"/><path d="m77 35 4-3m-3 10h5" stroke="#fff3bf" stroke-width="2" stroke-linecap="round"/><g class="mouth-rest"><path d="M38 57q10 3 20 0q-2 16-10 13q-8 2-10-13" fill="#653f3d"/><path d="M40 59h16" stroke="#fff2da" stroke-width="3"/><path d="M44 67q4-3 8 0" stroke="#dc8a87" stroke-width="2"/></g><g class="mouth-speaking"><ellipse cx="48" cy="62" rx="7" ry="5.2" fill="#653f3d"/><path d="M44 59h8" stroke="#fff0d5" stroke-width="2"/><path d="M45 65q3-2 6 0" stroke="#d99388" stroke-width="1.5"/></g></g></svg>