<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><style>.speech-head{transform-origin:48px 72px;animation:nod 1.8s ease-in-out infinite}.mouth-rest{animation:closed 0.34s steps(1,end) infinite}.mouth-speaking{transform-origin:48px 62px;animation:syllable 0.34s ease-in-out infinite}@keyframes closed{0%,90%,100%{opacity:1}10%,76%{opacity:0}}@keyframes syllable{0%,90%,100%{opacity:0;transform:scaleY(.15)}10%,76%{opacity:1;transform:scaleY(1)}}@keyframes nod{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.7deg) translateY(-.5px)}}@media(prefers-reduced-motion:reduce){.speech-head{animation:none}}</style><rect width="96" height="96" rx="16" fill="#dda96c"/><circle cx="75" cy="18" r="28" fill="#ffffff25"/><path d="M12 96Q14 70 38 70h20Q82 72 84 96" fill="#517a53"/><g class="speech-head"><path d="M25 27C19 30 17 42 20 53L16 66Q14 78 31 80L36 40ZM71 27C77 30 79 42 76 53L80 66Q82 78 65 80L60 40Z" fill="#653d30"/><path d="M40 60h16v16Q48 83 40 76" fill="#f0c39a"/><ellipse cx="48" cy="44" rx="23" ry="27" fill="#f0c39a"/><path d="M24 42V28Q28 12 49 15L66 13 63 22Q78 23 71 43L62 33 34 31Z" fill="#653d30"/><path d="M32 38l9 2m14-2 9 2" stroke="#653d30" stroke-width="2" stroke-linecap="round"/><g fill="#29303b"><circle cx="37" cy="46" r="2.2"/><circle cx="59" cy="46" r="2.2"/><path d="M47 46l-2 9h5" fill="none" stroke="#543a3a55" stroke-width="2"/><g class="mouth-rest"><path d="M40 62q8-4 16 1" fill="none" stroke="#713f43" stroke-width="2.2" stroke-linecap="round"/></g><g class="mouth-speaking"><ellipse cx="48" cy="62" rx="8.5" ry="6.5" fill="#653f3d"/><path d="M43 59h10" stroke="#fff0d5" stroke-width="2.2"/><path d="M44 66q4-2 8 0" stroke="#d99388" stroke-width="1.7"/></g></g></svg>