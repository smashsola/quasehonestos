<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><style>.speech-head{transform-origin:48px 72px;animation:nod 1.1400000000000001s ease-in-out infinite}.mouth-rest{animation:closed 0.19s steps(1,end) infinite}.mouth-speaking{transform-origin:48px 62px;animation:syllable 0.19s ease-out infinite}@keyframes closed{0%,80%,100%{opacity:1}10%,65%{opacity:0}}@keyframes syllable{0%,80%,100%{opacity:0;transform:scaleY(.15)}10%,65%{opacity:1;transform:scaleY(.95)}35%{opacity:1;transform:scaleY(.6)}}@keyframes nod{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-.7px)}}@media(prefers-reduced-motion:reduce){.speech-head{animation:gentle-nod 1.8s ease-in-out infinite}@keyframes gentle-nod{0%,100%{transform:translateY(0)}50%{transform:translateY(-.2px)}}}</style><rect width="96" height="96" rx="16" fill="#dda4ce"/><circle cx="75" cy="18" r="28" fill="#ffffff25"/><path d="M12 96Q14 70 38 70h20Q82 72 84 96" fill="#694582"/><g class="speech-head"><path d="M40 60h16v16Q48 83 40 76" fill="#a66a49"/><ellipse cx="48" cy="44" rx="23" ry="27" fill="#a66a49"/><g fill="#ded4bf"><path d="M25 42Q13 14 37 15Q64 8 72 38L63 37Q50 24 36 36Z"/></g><path d="M31 34q5-4 11 0m12 0q5-4 11 0" stroke="#ded4bf" stroke-width="2" stroke-linecap="round"/><g fill="#fff5df"><ellipse cx="37" cy="46" rx="4.5" ry="5"/><ellipse cx="59" cy="46" rx="4.5" ry="5"/></g><g fill="#29303b"><circle cx="37" cy="46" r="2"/><circle cx="59" cy="46" r="2"/></g><path d="M47 46l-2 9h5" fill="none" stroke="#915f4933" stroke-width="2"/><path d="M83 37v8" stroke="#fff3bf" stroke-width="2.8" stroke-linecap="round"/><circle cx="83" cy="50" r="1.8" fill="#fff3bf"/><g class="mouth-rest"><ellipse cx="48" cy="62" rx="4.5" ry="6" fill="#684842"/></g><g class="mouth-speaking"><ellipse cx="48" cy="62" rx="7" ry="5.2" fill="#653f3d"/><path d="M44 59h8" stroke="#fff0d5" stroke-width="2"/><path d="M45 65q3-2 6 0" stroke="#d99388" stroke-width="1.5"/></g></g></svg>