<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><style>.speech-head{transform-origin:48px 72px;animation:nod 0.756s ease-in-out infinite}.mouth-rest{animation:closed 0.126s steps(1,end) infinite}.mouth-speaking{transform-origin:48px 62px;animation:syllable 0.126s ease-out infinite}@keyframes closed{0%,80%,100%{opacity:1}10%,65%{opacity:0}}@keyframes syllable{0%,80%,100%{opacity:0;transform:scaleY(.15)}10%,65%{opacity:1;transform:scaleY(.95)}35%{opacity:1;transform:scaleY(.6)}}@keyframes nod{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-.7px)}}@media(prefers-reduced-motion:reduce){.speech-head,.mouth-rest,.mouth-speaking{animation:none}.mouth-rest{opacity:1}.mouth-speaking{opacity:0}}</style><rect width="96" height="96" rx="16" fill="#8ed8b6"/><circle cx="75" cy="18" r="28" fill="#ffffff25"/><path d="M12 96Q14 70 38 70h20Q82 72 84 96" fill="#467f66"/><g class="speech-head"><path d="M40 60h16v16Q48 83 40 76" fill="#bd8059"/><ellipse cx="48" cy="44" rx="23" ry="27" fill="#bd8059"/><g fill="#29212e"><path d="M22 40Q20 10 48 13Q80 12 76 76L64 72V35H31V76L19 71Z"/></g><path d="M32 40l10-4m12 0l10 4" stroke="#29212e" stroke-width="2" stroke-linecap="round"/><g fill="#29303b"><circle cx="37" cy="46" r="2.2"/><circle cx="59" cy="46" r="2.2"/></g><path d="M47 46l-2 9h5" fill="none" stroke="#915f4933" stroke-width="2"/><ellipse cx="31" cy="53" rx="3" ry="2" fill="#d7877933"/><ellipse cx="65" cy="53" rx="3" ry="2" fill="#d7877933"/><g class="mouth-rest"><path d="M40 64q8-8 16 0" fill="none" stroke="#764b43" stroke-width="2.5" stroke-linecap="round"/></g><g class="mouth-speaking"><ellipse cx="48" cy="62" rx="5.5" ry="5.2" fill="#653f3d"/><path d="M44 59h8" stroke="#fff0d5" stroke-width="2"/><path d="M45 65q3-2 6 0" stroke="#d99388" stroke-width="1.5"/></g></g></svg>