<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><style>.speech-head{transform-origin:48px 72px;animation:nod 0.8400000000000001s ease-in-out infinite}.mouth-rest{animation:closed 0.14s steps(1,end) infinite}.mouth-speaking{transform-origin:48px 62px;animation:syllable 0.14s ease-out infinite}@keyframes closed{0%,80%,100%{opacity:1}10%,65%{opacity:0}}@keyframes syllable{0%,80%,100%{opacity:0;transform:scaleY(.15)}10%,65%{opacity:1;transform:scaleY(.95)}35%{opacity:1;transform:scaleY(.6)}}@keyframes nod{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.8deg) translateY(-.7px)}}@media(prefers-reduced-motion:reduce){.speech-head,.mouth-rest,.mouth-speaking{animation:none}.mouth-rest{opacity:1}.mouth-speaking{opacity:0}}</style><rect width="96" height="96" rx="16" fill="#edbc71"/><circle cx="75" cy="18" r="28" fill="#ffffff25"/><path d="M12 96Q14 70 38 70h20Q82 72 84 96" fill="#bf7140"/><g class="speech-head"><path d="M40 60h16v16Q48 83 40 76" fill="#dfad83"/><ellipse cx="48" cy="44" rx="23" ry="27" fill="#dfad83"/><g fill="#28333e"><path d="M24 40V28Q28 12 49 15L66 13 63 22Q78 23 71 43L62 33 34 31Z"/></g><path d="M32 37q5-4 10 0m12 0q5-4 10 0" stroke="#28333e" stroke-width="2" stroke-linecap="round"/><g fill="#29303b"><circle cx="37" cy="46" r="2.2"/><circle cx="59" cy="46" r="2.2"/></g><path d="M47 46l-2 9h5" fill="none" stroke="#915f4933" stroke-width="2"/><g fill="none" stroke="#273b4c" stroke-width="3"><rect x="29" y="40" width="17" height="12" rx="3"/><rect x="51" y="40" width="17" height="12" rx="3"/><path d="M46 45h5"/></g><g class="mouth-rest"><path d="M39 58q9 12 18 0" fill="none" stroke="#764b43" stroke-width="2" stroke-linecap="round"/></g><g class="mouth-speaking"><ellipse cx="48" cy="62" rx="7" ry="5.2" fill="#653f3d"/><path d="M44 59h8" stroke="#fff0d5" stroke-width="2"/><path d="M45 65q3-2 6 0" stroke="#d99388" stroke-width="1.5"/></g></g></svg>